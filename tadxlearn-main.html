<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#2d3440;--mut:#6b7686;--line:#e4e8f0;--acc:#1f9d8b;--acc2:#f0a93a;--bad:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1f27;--card:#252c37;--ink:#e8ecf1;--mut:#9aa6b5;--line:#374050}}
:root[data-theme=dark]{--bg:#1a1f27;--card:#252c37;--ink:#e8ecf1;--mut:#9aa6b5;--line:#374050}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Source Sans 3',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0 0 .4em;line-height:1.1}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:.6em 1.1em;background:var(--acc);color:#fff;font-weight:600;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.warn{background:var(--acc2);color:#2d3440}button.bad{background:var(--bad)}
input,textarea{width:100%;padding:.65em .8em;border:1px solid var(--line);border-radius:10px;background:var(--card);margin:.25em 0 .8em}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
label{font-size:.9rem;color:var(--mut)}
.top{display:flex;gap:.5rem;position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:9}
.top button{padding:.35em .7em;font-size:.85rem}
/* auth */
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{background:#2d3440;color:#fff;padding:8vw 6vw;display:flex;flex-direction:column;justify-content:center;gap:1.5rem;overflow:hidden;position:relative}
.hero h1{font-size:clamp(2.4rem,5vw,4.2rem);font-weight:800}
.hero li{list-style:none;margin:.5rem 0;opacity:0;animation:in .6s forwards}
.hero li:nth-child(2){animation-delay:.15s}.hero li:nth-child(3){animation-delay:.3s}.hero li:nth-child(4){animation-delay:.45s}
.hero li b{color:var(--acc2);margin-right:.5rem}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.stack{position:relative;height:150px;width:260px;perspective:800px}
.stack div{position:absolute;inset:0;border-radius:16px;background:#3a4453;padding:1rem;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;border:1px solid #4d5a6d;animation:cyc 9s infinite}
.stack div:nth-child(2){animation-delay:-3s;background:#1f9d8b}.stack div:nth-child(3){animation-delay:-6s;background:#f0a93a;color:#2d3440}
@keyframes cyc{0%{transform:translateY(0) rotateY(0) scale(1);z-index:3}30%{transform:translateY(0) rotateY(0) scale(1);z-index:3}38%{transform:translateY(0) rotateY(180deg) scale(1)}55%{transform:translate(30px,-16px) rotateY(180deg) scale(.94);z-index:2}80%{transform:translate(60px,-32px) scale(.88);z-index:1;opacity:.7}100%{transform:translateY(0) scale(1);z-index:3}}
.form{padding:8vw 6vw;display:flex;flex-direction:column;justify-content:center;max-width:520px}
.tabs{display:flex;gap:.5rem;margin-bottom:1rem}.tabs button{flex:1}
.err{color:var(--bad);min-height:1.4em;font-size:.9rem}
.small{font-size:.85rem;color:var(--mut)}
/* app */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:#2d3440;color:#fff;padding:1.2rem .8rem;display:flex;flex-direction:column;gap:.3rem;position:sticky;top:0;height:100vh}
nav h2{padding:0 .6rem;margin-bottom:1rem}
nav button{background:transparent;text-align:left;color:#cfd6df;display:flex;gap:.6rem;transition:background .2s,padding .2s}
nav button:hover,nav button.on{background:#3a4453;color:#fff;padding-left:1.4em}
nav button.on{box-shadow:inset 3px 0 var(--acc2)}
main{padding:2rem clamp(1rem,4vw,3rem);max-width:1000px;width:100%}
.view{animation:vin .35s ease}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:1rem 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.1rem}
.big{font:800 2.6rem 'Bricolage Grotesque',sans-serif}
.ring{width:96px;height:96px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .v{stroke:var(--acc);stroke-dasharray:264;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px}
.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px;transform-origin:bottom;animation:grow .7s backwards}
@keyframes grow{from{transform:scaleY(0)}}
.split{display:grid;grid-template-columns:230px 1fr;gap:1rem}
.item{padding:.6em .8em;border-radius:10px;cursor:pointer;border:1px solid transparent}.item:hover,.item.on{background:var(--card);border-color:var(--line)}
textarea{min-height:240px;resize:vertical}
.flip{perspective:1000px;height:240px;margin:1rem 0;cursor:pointer}
.flip>div{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.f>div{transform:rotateY(180deg)}
.flip p{position:absolute;inset:0;margin:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5rem;border-radius:18px;font:700 1.6rem 'Bricolage Grotesque',sans-serif;background:var(--card);border:1px solid var(--line)}
.flip p+p{transform:rotateY(180deg);background:var(--acc);color:#fff;border:0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin:.4rem 0}
.opt.ok{background:var(--acc);color:#fff;animation:pop .4s}.opt.no{background:var(--bad);color:#fff;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chat{max-height:360px;overflow:auto}.msg{padding:.6em .9em;border-radius:12px;margin:.4rem 0;max-width:85%;animation:vin .3s}
.msg.u{background:var(--acc);color:#fff;margin-left:auto}.msg.a{background:var(--card);border:1px solid var(--line)}
.tag{display:inline-block;padding:.1em .6em;border-radius:99px;background:var(--acc2);color:#2d3440;font-size:.8rem;font-weight:600}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#2d3440;color:#fff;padding:.7em 1.2em;border-radius:99px;animation:vin .3s;z-index:20}
@media(max-width:760px){.auth,.app,.split{grid-template-columns:1fr}nav{height:auto;position:static;flex-direction:row;flex-wrap:wrap}nav h2{width:100%}.hero{padding:16vw 6vw 8vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.brand{display:flex;align-items:center;gap:.6rem}
.pb{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:.5rem 0}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}.heat i{aspect-ratio:1;border-radius:4px;background:var(--acc);animation:pop .5s backwards}
.bdg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem}.bd{text-align:center;padding:.8rem .4rem;border-radius:12px;border:1px solid var(--line);font-size:.85rem}
.bd span{display:block;font-size:1.8rem}.bd.off{opacity:.35;filter:grayscale(1)}.bd.on{background:var(--card);animation:pop .6s backwards}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}.chip{background:var(--card);color:var(--ink);border:2px solid var(--line);padding:.8em 1.2em;border-radius:14px;transition:all .2s}.chip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,var(--card));transform:scale(1.04)}
.onb{max-width:660px;margin:0 auto;padding:6vh 1.2rem;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:.7rem}.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem;cursor:pointer;transition:transform .2s,border-color .2s}.tc:hover{transform:translateY(-3px);border-color:var(--acc)}.tc span{font-size:1.6rem;display:block}
.out{white-space:pre-wrap;min-height:70px}select{padding:.55em;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
nav{overflow:auto}.drop{transition:border-color .2s,transform .2s}.drop.h{border-color:var(--acc);transform:scale(1.01)}
.pal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;justify-content:center;padding-top:14vh}.pal>div{background:var(--card);border-radius:14px;width:min(520px,92vw);align-self:flex-start;padding:.6rem}
body.dys,body.dys *{font-family:Lexend,system-ui,sans-serif!important;letter-spacing:.04em;word-spacing:.12em}body.dys{line-height:1.9}
body{background:radial-gradient(900px 420px at 100% -5%,color-mix(in srgb,var(--acc) 16%,transparent),transparent),radial-gradient(700px 400px at -5% 105%,color-mix(in srgb,var(--acc2) 13%,transparent),transparent),var(--bg);background-attachment:fixed}
h1{font-size:clamp(1.8rem,3vw,2.5rem);letter-spacing:-.02em}main{max-width:1080px}
.box{border-radius:20px;box-shadow:0 1px 2px #1a1f2712,0 14px 30px -18px #1a1f2740}
main button:not(.ghost):not(.chip):not(.opt):not(.warn):not(.bad),.form>button,#nx{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 62%,#3b6cf5));box-shadow:0 8px 18px -10px var(--acc)}
nav{background:var(--card);color:var(--ink);border-right:1px solid var(--line);width:240px}.app{grid-template-columns:240px 1fr}
nav button{color:var(--mut);border-radius:12px;font-weight:600}nav button:hover,nav button.on{background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--ink);padding-left:1.1em}nav button.on{color:var(--acc);box-shadow:none}
.tag{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}.chip{font-weight:600}
.big{background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
input,textarea,select{border-radius:12px}.hero{background:linear-gradient(160deg,#2d3440,#1d4d55)}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem;margin:1rem 0}.sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1rem;cursor:pointer;display:flex;flex-direction:column;gap:.2rem;transition:transform .2s,box-shadow .2s}.sc:hover{transform:translateY(-4px);box-shadow:0 14px 28px -14px var(--acc)}.sc span{font-size:1.8rem}.sc small{color:var(--acc);font-weight:600}
.opt{border-radius:14px;padding:.9em 1em;display:flex;gap:.8rem;align-items:center;transition:transform .15s,border-color .15s}.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--acc)}
.lt{width:1.8rem;height:1.8rem;border-radius:9px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;flex:none}.opt.ok .lt,.opt.no .lt{background:#fff3;color:#fff}

el.innerHTML=`<h1>${t('shop')} <span class=tag>🪙 ${d.coins||0}</span></h1><div class=grid><div class=box><h3>🧊 ${t('frz')} (${d.frz||0})</h3><button id=bf>${t('buy')} · 50 🪙</button></div><div class=box><h3>${t('th')}</h3><div class=row>${['#e4572e','#7c5cff','#e6528c','#2f80ed'].map(c=>`<button data-c=${c} style="background:${c};width:44px;height:44px;padding:0;${d.acc==c?'outline:3px solid var(--ink)':''}"></button>`).join('')}<button class=ghost data-c="">↺</button></div><p class=small>80 🪙</p></div><div class=box><h3>${t('av')}</h3><div class=row>${['🦊','🐼','🐙','🦄'].map(a=>`<button class=ghost data-v=${a}>${a}</button>`).join('')}<button class=ghost data-v="">∅</button></div><p class=small>40 🪙</p></div></div>`;
$('#bf').onclick=()=>buy(50,()=>d.frz=(d.frz||0)+1);
el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(!c||d.own.includes(c)){d.acc=c;save();applyPrefs();return shop(el)}buy(80,()=>{d.own.push(c);d.acc=c})});
el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(!v||d.own.includes(v)){d.av=v;save();return shop(el)}buy(40,()=>{d.own.push(v);d.av=v})})}
function qc(el){const d=D();d.quizzes=d.quizzes||[];const Z=d.quizzes.find(x=>x.id==qcId),L=S.lang=='cs'?0:1,E=Z&&qeI!=null?Z.qs[qeI]:null;
el.innerHTML=`<h1>${t('qc')} <span class=tag>🧩</span></h1><div class=split><div><button id=zn style="width:100%;margin-bottom:.6rem">＋ ${t('zn')}</button>${d.quizzes.map(x=>`<div class="item ${x.id==qcId?'on':''}" data-z=${x.id}>🧩 ${esc(x.name)}<br><span class=small>${x.qs.length} ${t('qn')}${x.best!=null?` · 🏆 ${x.best} %`:''}</span></div>`).join('')||`<p class=small>${t('none')}</p>`}<textarea id=zi style="min-height:70px;margin-top:.8rem" placeholder="${esc(t('zcode'))}"></textarea><button class=ghost id=zim>${t('imp2')}</button></div>
<div>${Z?`<div class=box><input id=zt value="${esc(Z.name)}" style="font:700 1.3rem 'Bricolage Grotesque'"><div class=row><select id=zs><option value="">—</option>${SUBJ.map((x,i)=>`<option value=${i} ${Z.sub===i?'selected':''}>${x[L]}</option>`).join('')}</select><button id=zp ${Z.qs.length?'':'disabled'}>▶ ${t('zplay')}</button><button class=ghost id=zsh>${t('zshare')}</button><button class=ghost id=zdu>${t('zdup')}</button><button class=ghost id=zdl>${t('del')}</button></div></div>
<div class=box style="margin-top:1rem"><h3>${E?t('zedit'):t('zaddq')}</h3><textarea id=zq style="min-height:70px" placeholder="${esc(t('zq'))}">${E?esc(E.q):''}</textarea>${[0,1,2,3].map(i=>`<div class=row style="flex-wrap:nowrap"><input type=radio name=zr value=${i} ${(E?E.a:0)==i?'checked':''} style="width:auto;margin:0"><input class=zo placeholder="${'ABCD'[i]}" value="${E?esc(E.o[i]||''):''}" style="margin:.25em 0"></div>`).join('')}<input id=ze placeholder="${esc(t('zex'))}" value="${E?esc(E.e||''):''}"><div class=row><button id=zsv>${E?t('zsave'):t('add')}</button>${E?`<button class=ghost id=zcx>${t('back')}</button>`:''}<span class=small id=zm></span></div></div>
<div class=box style="margin-top:1rem"><h3>✦ ${t('zai')}</h3><div class=row><input id=zat placeholder="${esc(t('topic'))}" style="flex:1;margin:0"><select id=zsrc><option value="">${t('paste')}…</option>${srcs(d).map(n=>`<option value="${n.id}">${esc(n.title)}</option>`).join('')}</select><select id=zan><option>5</option><option>10</option></select><button id=zag>${t('gen')}</button></div><p class=small id=zam></p></div>
<div class=box style="margin-top:1rem"><h3>${Z.qs.length} ${t('qn')}</h3>${Z.qs.map((x,i)=>`<div class=row style="padding:.4rem 0;border-bottom:1px solid var(--line)"><span style="flex:1"><b>${i+1}.</b> ${esc(x.q)}<br><span class=small>✔ ${esc(x.o[x.a])}</span></span><button class=ghost data-e=${i}>✎</button><button class=ghost data-d=${i}>×</button></div>`).join('')}</div>${qcOut?`<div class=box style="margin-top:1rem"><h3>${t('zshare')}</h3><textarea readonly style="min-height:90px">${esc(qcOut)}</textarea></div>`:''}`:''}</div></div>`;
const pick=id=>{qcId=id;qeI=null;qcOut='';save();qc(el)};
$('#zn').onclick=()=>{const z={id:uid(),name:t('zn'),sub:null,qs:[]};d.quizzes.unshift(z);pick(z.id)};
el.querySelectorAll('[data-z]').forEach(i=>i.onclick=()=>pick(i.dataset.z));
$('#zim').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#zi').value.trim()))));if(!o.n||!Array.isArray(o.q))throw 0;const z={id:uid(),name:o.n,sub:o.s==null?null:o.s,qs:o.q.filter(zv)};d.quizzes.unshift(z);pick(z.id)}catch(e){toast(t('noimp'))}};
if(!Z)return;
$('#zt').oninput=e=>{Z.name=e.target.value;save()};$('#zs').onchange=e=>{Z.sub=e.target.value===''?null:+e.target.value;save()};
$('#zsv').onclick=()=>{const q=$('#zq').value.trim(),op=[...el.querySelectorAll('.zo')].map(i=>i.value.trim()),ci=+el.querySelector('[name=zr]:checked').value,o=op.filter(Boolean);if(!q||!op[ci]||o.length<2){$('#zm').textContent=t('zmin');return}const x={q,o,a:o.indexOf(op[ci]),e:$('#ze').value.trim()};if(E)Z.qs[qeI]=x;else{Z.qs.push(x);addXp(2)}qeI=null;save();qc(el)};
if($('#zcx'))$('#zcx').onclick=()=>{qeI=null;qc(el)};
el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{qeI=+b.dataset.e;qc(el)});
el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{Z.qs.splice(+b.dataset.d,1);qeI=null;save();qc(el)});
$('#zp').onclick=()=>{aqs={qs:Z.qs.map(shq),i:0,sc:0,wr:[],end:0,from:'qc',qid:Z.id};aq(el)};
$('#zsh').onclick=()=>{qcOut=btoa(unescape(encodeURIComponent(JSON.stringify({n:Z.name,s:Z.sub,q:Z.qs}))));try{navigator.clipboard.writeText(qcOut);toast('✔')}catch(e){}qc(el)};
$('#zdu').onclick=()=>{const z={...JSON.parse(JSON.stringify(Z)),id:uid(),name:Z.name+' (2)',best:null,plays:0};d.quizzes.unshift(z);pick(z.id)};
$('#zdl').onclick=()=>{d.quizzes=d.quizzes.filter(x=>x!=Z);qcId=null;qcOut='';save();qc(el)};
$('#zag').onclick=async()=>{const sm=await getAI(),m=$('#zam');if(!sm){m.textContent=t('noai');return}const sr=srcs(d).find(x=>x.id==$('#zsrc').value),tp=$('#zat').value.trim();if(!sr&&!tp)return;m.textContent='…';
try{const r=await sm.json(`Write ${$('#zan').value} high-quality multiple-choice questions ${sr?'strictly based on the text below':'about: '+tp}. Each tests real understanding, has exactly one correct answer, 3 plausible wrong answers and a one-sentence explanation. Return only a JSON array of {"q":"","o":["","","",""],"a":0,"e":""}; vary the correct index. Language: ${LN()}.${sr?'\n\nText:\n'+sr.text.slice(0,30000):''}`,{cache:false}),k=(Array.isArray(r)?r:[]).filter(zv);if(!k.length)throw 0;Z.qs.push(...k);addXp(k.length*2);save();qc(el)}catch(e){m.textContent=t('noai')}}}
function ask(el){el.innerHTML=`<h1>${t('ask')} <span class=tag>AI</span></h1><div class="box chat" id=ch>${chat.map(m=>`<div class="msg ${m.r}">${esc(m.x)}</div>`).join('')}</div><div class=row style="margin-top:.8rem"><input id=q style="flex:1;margin:0" placeholder="${esc(t('ph'))}"><button id=sd>${t('send')}</button></div>`;
const go=async()=>{const q=$('#q').value.trim();if(!q)return;chat.push({r:'u',x:q});const m={r:'a',x:'…'};chat.push(m);ask(el);const sm=await getAI(),ctx=srcs(D()).map(n=>n.title+':\n'+n.text).join('\n\n').slice(0,12000);
if(sm){try{await sm(`You are TadxLearn, a study tutor (tone: ${STY[D().sty||0]}). Use the student's notes when relevant, otherwise general knowledge. Answer in ${LN()}, concisely.\n\nNotes:\n${ctx}\n\nQuestion: ${q}`,{cache:false,onText:({text})=>{m.x=text;const c=$('#ch');if(c&&c.lastChild){c.lastChild.textContent=text;c.scrollTop=c.scrollHeight}}});addXp(3)}catch(e){m.x=t('noai')}}
else{const w=q.toLowerCase().match(/[\p{L}]{3,}/gu)||[];let best=null,bs=0;D().notes.forEach(n=>n.text.split(/\n+/).forEach(l=>{const c=w.filter(a=>l.toLowerCase().includes(a)).length;if(c>bs){bs=c;best={n:n.title,l}}}));m.x=best?`${t('af')} „${best.n}“: ${best.l}`:t('nf')}
ask(el)};$('#sd').onclick=go;$('#q').onkeydown=e=>{if(e.key=='Enter')go()}}
render();
</script></body></html>
